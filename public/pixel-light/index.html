<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#142923">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css"><title>Pixel Light</title>
</head>
<body>
<main>
  <h1>Pixel G1s</h1>
  <section class="connection" aria-label="Connection">
    <p id="status" role="status" aria-live="polite">Not connected</p>
    <button id="connect">Connect light</button><button id="disconnect" hidden class="secondary">Disconnect</button>
  </section>
  <form id="controls">
    <fieldset disabled id="fieldset">
      <legend class="sr-only">Light controls</legend>
      <section><div class="label-row"><label for="brightness">Brightness</label><output id="brightness-value" for="brightness">50%</output></div>
      <input id="brightness" type="range" min="0" max="100" value="50">
      <button type="button" id="apply-brightness">Apply brightness</button></section>
        <section><div class="label-row"><label for="kelvin">White temperature</label><output id="kelvin-value" for="kelvin">5600 K</output></div>
        <input id="kelvin" type="range" min="2500" max="8500" step="100" value="5600"><button type="button" id="apply-cct">Apply white</button></section>
        <section><div class="label-row"><label for="hue">Colour hue</label><output id="hue-value" for="hue">180°</output></div>
        <input id="hue" class="hue" type="range" min="0" max="360" value="180">
        <div class="label-row"><label for="saturation">Saturation</label><output id="saturation-value" for="saturation">100%</output></div>
        <input id="saturation" type="range" min="0" max="100" value="100"><button type="button" id="apply-hsi">Apply colour</button></section>
    </fieldset>
  </form>
  <p id="message" role="status" aria-live="polite"></p>
</main><script type="module" src="app.js"></script>
</body></html>
